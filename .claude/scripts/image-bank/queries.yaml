# Requetes de recherche de la banque d'images, une entree par categorie du site.
#
# Les requetes sont en ANGLAIS : Unsplash et Pexels indexent leurs photos en anglais,
# une requete francaise ne remonte quasiment rien.
#
# Pour recharger la banque quand elle s'epuise : ajouter des requetes ici, relancer
# fetch-candidates.py, cocher les nouvelles vignettes. Les photos deja dans la banque
# sont automatiquement exclues des candidats.
#
# `tags` alimente les mots-cles de chaque image dans data/image-bank.yaml : ce sont eux
# que Claude matche avec le sujet de l'article au moment de /create-article-geo.

- category: creer-son-entreprise
  tags: [creation, immatriculation, lancement, projet]
  queries:
    - business plan notebook desk
    - new shop owner opening
    - startup founder paperwork

- category: statuts-juridiques
  tags: [statut, contrat, juridique, signature]
