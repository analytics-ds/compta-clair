# Liste canonique des 9 categories du site.
# Source unique statique : titre + slug par langue. Les templates transverses (accueil, footer,
# plan du site, meta d'article, fil d'Ariane) lisent CE fichier plutot que de rappeler des pages
# via .Site.GetPage ou la taxonomie categories : sur ce site multilingue (Hugo 0.139 a 0.166
# testes), .Site.Taxonomies fusionne les langues de facon non deterministe, et .Site.GetPage /
# .Site.Pages se sont aussi averes non fiables lorsqu'ils sont appeles depuis une AUTRE page que
# celle de la categorie elle-meme (notamment vide cote EN). Seule content/categories/<slug>/_index.md
# (rendue directement par layouts/categories/list.html, "." deja resolu par Hugo) reste la source
# de verite pour l'intro et la FAQ de chaque categorie.
